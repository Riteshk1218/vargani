# Local development stack: PostgreSQL, Redis, Django API, Celery worker, React web app.
# Usage: cp backend/.env.example backend/.env && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vargani
      POSTGRES_USER: vargani
      POSTGRES_PASSWORD: vargani
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vargani"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://vargani:vargani@db:5432/vargani
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://vargani:vargani@db:5432/vargani
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    volumes: ["./backend:/app"]
    depends_on: [backend]

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0"
    environment:
      VITE_DEV_API_TARGET: http://backend:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
