name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vargani
          POSTGRES_USER: vargani
          POSTGRES_PASSWORD: vargani
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vargani" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://vargani:vargani@localhost:5432/vargani
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py compilemessages
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --fail-on-warn --file /tmp/schema.yml
      - run: pytest --create-db
      - name: Receipt numbering under concurrency (CI database is throwaway)
        run: python manage.py migrate && python scripts/check_receipt_concurrency.py
        env:
          VARGANI_THROWAWAY_DB: "1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
