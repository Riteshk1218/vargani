name: Mobile app

# Tests the Flutter app and builds an Android APK and Play Store bundle.
# Download them from the run's "Artifacts" section. Builds of main are also published as a
# GitHub Release, so the newest APK is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/vargani.apk
#
# Repository settings used (Settings -> Secrets and variables -> Actions):
#   Variable API_BASE            e.g. https://api.your-domain.in  (no /api/v1); default: the live Render site
#   Secret   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#            (optional; without them the build is signed with a debug key: fine for testing,
#             not accepted by Google Play)

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build APK and App Bundle
        run: |
          API="${{ vars.API_BASE }}"
          flutter build apk --release --dart-define=API_BASE="${API:-https://vargani-cqoq.onrender.com}"
          flutter build appbundle --release --dart-define=API_BASE="${API:-https://vargani-cqoq.onrender.com}"
      - uses: actions/upload-artifact@v4
        with:
          name: vargani-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Publish APK as a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk vargani.apk
          gh release create "app-${{ github.run_number }}" vargani.apk \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Mobile app build ${{ github.run_number }}" \
            --notes "Android app built from ${{ github.sha }}. Download vargani.apk and open it on the phone to install or update."
