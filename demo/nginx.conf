# Demo only: the website on port 80 and the mobile app (web build) on port 81, both forwarding
# /api and /media to Django, so everything works from one address (also from a phone on the same Wi-Fi).

server {
    listen 80;
    client_max_body_size 12m;
    root /usr/share/nginx/html;
    location /api/   { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /media/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /django-admin/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /       { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

server {
    listen 81;
    client_max_body_size 12m;
    root /srv/mobile;
    location /api/   { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /media/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /       { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
